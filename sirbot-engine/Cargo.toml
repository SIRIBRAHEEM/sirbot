[package]
name = "sirbot-engine"
version = "2.0.0"
edition = "2021"
description = "SIRBOT v2 — Sub-millisecond NFT mint engine"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

# Pre-signing: secp256k1 + rlp for raw transaction encoding
k256 = { version = "0.13", features = ["ecdsa"] }
rlp = "0.5"
sha3 = "0.10"

# WebSocket for persistent fast connections
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
